name: build

on:
  push:
    branches: [main]
    tags-ignore: ['**']
  pull_request:
  # Weekly, so a newly published advisory against a dependency is found without
  # waiting for the next commit.
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: read

env:
  DOTNET_NOLOGO: 'true'
  DOTNET_CLI_TELEMETRY_OPTOUT: 'true'
  CI: 'true'

jobs:
  build:
    name: build and self-test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The editor self-test builds every Avalonia view, which needs a display
      # and the same native libraries the release package depends on.
      - name: Install native dependencies
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            xvfb libfontconfig1 libx11-6 libxext6 libxi6 libxrandr2 \
            libxcursor1 libxfixes3 libice6 libsm6 libgl1 libudev1 libdbus-1-3

      - name: Restore
        run: dotnet restore NexusManager.slnx

      # TreatWarningsAsErrors is set in Directory.Build.props, so "0 Errors,
      # N Warnings" cannot pass here either.
      - name: Build
        run: dotnet build NexusManager.slnx -c Release --no-restore

      # No hardware and no display: validates the analysis chain against signals
      # whose answer is known beforehand, and exits non-zero on any failure.
      - name: DSP self-test
        run: ./src/NexusManager.Cli/bin/Release/net10.0/nexus-manager visualizer --selftest

      # Builds a synthetic .cuescreens pack and asserts it round-trips. Guards
      # the cereal behaviour that produced three separate importer faults, each
      # of which looked like success. The real packs are Corsair's and cannot
      # be committed, so the fixture is generated.
      # ⛔ The one check that would have caught a visualizer screen rendering
      # nothing: it runs the editor's real Tick against a real capture and
      # compares the frame to the same frame without audio. Skipped when no
      # config here carries a visualizer, which is the CI default.
      - name: Editor visualizer probe
        run: |
          xvfb-run -a ./src/NexusManager.Editor/bin/Release/net10.0/nexus-manager-editor \
            --probe-visualizer || test $? -eq 2

      - name: Import self-test
        run: ./src/NexusManager.Cli/bin/Release/net10.0/nexus-manager import --selftest

      - name: Sensor discovery
        run: ./src/NexusManager.Cli/bin/Release/net10.0/nexus-manager sensors

      # Renders a real frame through SkiaSharp, which is what proves the native
      # library loaded and found fontconfig.
      - name: Render a frame
        run: |
          ./src/NexusManager.Cli/bin/Release/net10.0/nexus-manager preview --out /tmp/frame.png
          test -s /tmp/frame.png

      - name: Editor self-test
        run: xvfb-run -a ./src/NexusManager.Editor/bin/Release/net10.0/nexus-manager-editor --selftest

  audit:
    name: dependency audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore
        run: dotnet restore NexusManager.slnx

      # ⛔ `dotnet list package --vulnerable` EXITS 0 EVEN WHEN IT FINDS
      # VULNERABILITIES. Trusting its exit status gives a permanently green
      # check that never fails, which is worse than having no check at all - it
      # would be believed. The output has to be read.
      - name: Vulnerable packages
        run: |
          set -o pipefail
          dotnet list package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -qE 'has the following vulnerable packages' audit.txt; then
            echo "::error::Vulnerable dependencies found - see the log above."
            exit 1
          fi
          echo "No vulnerable packages."

      - name: Deprecated packages
        run: |
          set -o pipefail
          dotnet list package --deprecated 2>&1 | tee deprecated.txt
          if grep -qE 'has the following deprecated packages' deprecated.txt; then
            echo "::warning::Deprecated dependencies found - see the log above."
          fi

  reproducible:
    name: reproducible build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      # The release tarball's checksum is what the AUR package pins, so "the
      # published artifact came from the published source" is only checkable if
      # two builds of one commit agree. This asserts that they do, rather than
      # leaving it as a claim in the documentation.
      - name: Build twice and compare
        run: |
          bash packaging/build-release.sh > /dev/null
          first=$(sha256sum packaging/out/nexus-manager-*-linux-x64.tar.gz | cut -d' ' -f1)
          bash packaging/build-release.sh > /dev/null
          second=$(sha256sum packaging/out/nexus-manager-*-linux-x64.tar.gz | cut -d' ' -f1)
          echo "first:  $first"
          echo "second: $second"
          if [ "$first" != "$second" ]; then
            echo "::error::The release tarball is not reproducible."
            exit 1
          fi
          echo "Reproducible."

  codeql:
    name: CodeQL
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - uses: github/codeql-action/init@v3
        with:
          languages: csharp
          # Includes the queries that look for injection, path traversal and
          # unsafe deserialisation, rather than the default correctness set only.
          queries: security-and-quality

      - name: Build
        run: dotnet build NexusManager.slnx -c Release

      - uses: github/codeql-action/analyze@v3
